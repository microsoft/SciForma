# DeepSpeed ZeRO-2 + BF16 (no offload)
# gpu_ids: all → auto-detect available GPUs
#
# NOTE: gradient_accumulation_steps here is a PLACEHOLDER (set to 1).
# It gets overridden at runtime by Accelerator(gradient_accumulation_steps=config.XXX).
# The Python config is the single source of truth for GA.
# train_micro_batch_size_per_gpu must match train_batch_size in Python config.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: DEEPSPEED
downcast_bf16: 'no'
enable_cpu_affinity: false
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
deepspeed_config:
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: false
  zero3_save_16bit_model: false
  zero_stage: 2
  train_micro_batch_size_per_gpu: 1
