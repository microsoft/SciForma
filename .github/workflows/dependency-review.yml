name: "Dependency Review"

# Scans dependency manifest changes in pull requests and fails the check if a PR
# introduces a dependency with a known vulnerability or a disallowed license.
# Docs: https://docs.github.com/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Fail the PR on moderate-or-higher severity vulnerabilities.
          fail-on-severity: moderate
